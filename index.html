      return { label: g.label, hasLabel: !!g.label, aria: g.label || qcur.title, isSlider: false, isChoice: true, opts: g.opts.map(function (o) {
        var a = qz[g.key];
        var on = Array.isArray(a) ? a.indexOf(o) >= 0 : a === o;
        return { label: o, pressed: on ? 'true' : 'false', pick: function () {
          var p = { need: false };
          if (!g.multi) { p[g.key] = o; }
          else {
            var arr = (qz[g.key] || []).slice(); var i = arr.indexOf(o);
            if (i >= 0) { arr.splice(i, 1); } else { if (g.max && arr.length >= g.max) { arr.shift(); } arr.push(o); }
            p[g.key] = arr;
          }
          setQ(p);
        } };
      }) };
    });
    var qBar = function (n) { return 'flex: 1; height: 4px; border-radius: 2px; background: ' + (qi >= n ? '#1C2321' : '#ECEAE3') + ';'; };

    return {
      boardCards: boardCards, gradeStyle: {}, glossTopics: glossTopics, glossGrades: glossGrades, glossResult: glossResult, glossEmpty: gShown === 0, glossFiltered: !!gq || gg !== 'all' || gc !== 'all',
      glossCards: glossDecorate(glossCards),
      mbarCls: s.mStick ? 'on' : '', mjoinCls: (s.mStick && !s.mInFinder) ? 'on' : '',
      quizAsking: !qz.sent && qi < 3, quizResult: !qz.sent && qi >= 3, quizSent: !!qz.sent,
      quizStepLabel: 'Step ' + (Math.min(qi, 2) + 1) + ' of 3', quizQuestion: qcur.title, quizHint: qcur.hint, quizGroups: quizGroups,
      quizNeedPick: !!qz.need, quizCanBack: qi > 0, quizBar1: qBar(0), quizBar2: qBar(1), quizBar3: qBar(2),
      quizNextLabel: qi === 2 ? 'See my focus' : 'Next',
      quizJoinLabel: s.sending ? 'Joining…' : 'Join free, get my report',
      quizPicks: [].concat(qz.improve || [], qz.explore || []).map(function (l) { return { label: l }; }),
      quizNext: function () { if (!qStepDone()) { setQ({ need: true }); return; } setQ({ q: qi + 1, need: false }); },
      quizBack: function () { setQ({ q: Math.max(0, qi - 1), need: false }); },
      quizRestart: function () { self.setState({ quiz: { q: 0, health: '', improve: [], explore: [] }, formError: '' }); },
      submitQuiz: function (e) { sendForm(e, { subject: 'New NIA founding member + report request', form: 'Find your focus questionnaire', age: qz.age ? String(qz.age) : '', sex: qz.sex || '', health_now: qz.health || '', wants_to_improve: (qz.improve || []).join(', '), wants_to_explore: (qz.explore || []).join(', '), wants_report: 'Yes' }, function () { self.setState({ quiz: Object.assign({}, qz, { sent: true }), formError: '' }); }); },
      glossSearch: function (e) { var v = (e && e.target && typeof e.target.value === 'string') ? e.target.value : ''; glossTrackStart(); self.setState({ glossQ: v }); },
      glossPrev: function () { try { var t = document.getElementById('gloss-track'); if (t) { t.scrollBy({ left: -334, behavior: 'smooth' }); } } catch (err) {} },
      glossNext: function () { try { var t = document.getElementById('gloss-track'); if (t) { t.scrollBy({ left: 334, behavior: 'smooth' }); } } catch (err) {} },
      glossNoSubmit: function (e) { stop(e); },
      glossClear: function () { clearSearchBox(); self.setState({ glossQ: '', glossGrade: 'all', glossCat: 'all' }); },
      showProgress: signups >= 50, signups: signups, signupsLabel: signups.toLocaleString('en-GB'),
      progressWidth: Math.max(2, Math.round(signups / 3000 * 100)) + '%',
      stepForm: step === 'form', stepMore: step === 'more', stepDone: step === 'done', notForm: step !== 'form',
      joinLabel: s.sending ? 'Joining…' : 'Join free',
      formError: s.formError || '', hasFormError: !!s.formError,
      submitJoin: function (e) { sendForm(e, { subject: 'New NIA founding member', form: 'Join (top of page)' }, function () { self.setState({ step: 'more', formError: '' }); }); },
      submitMore: function (e) { sendForm(e, { subject: 'NIA founding member: answers', form: 'Optional questions' }, function () { self.setState({ step: 'done', formError: '' }); }); },
      submitJoinBottom: function (e) { sendForm(e, { subject: 'New NIA founding member', form: 'Join (founding members section)' }, function () { self.setState({ step: 'done', formError: '' }); }); },
      skipMore: function () { self.setState({ step: 'done' }); },
      copyLink: function () {
        var url = location.origin + location.pathname + '?ref=' + shareCode();
        try { if (navigator.share) { navigator.share({ title: 'NIA CLUB', text: 'Join NIA CLUB as a founding member', url: url }).catch(function () {}); } else if (navigator.clipboard) { navigator.clipboard.writeText(url); } } catch (err) {}
        self.setState({ copied: true });
      },
      copyLabel: s.copied ? 'Link copied' : 'Copy link to share',
      menuOpen: !!s.menuOpen, menuClosed: !s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false', menuLabel: s.menuOpen ? 'Close menu' : 'Open menu',
      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); },
      closeMenu: function () { self.setState({ menuOpen: false }); },
      scrollPrev: function () { try { var t = document.getElementById('nia-track'); if (t) { t.scrollBy({ left: -356, behavior: 'smooth' }); } } catch (err) {} },
      scrollNext: function () { try { var t = document.getElementById('nia-track'); if (t) { t.scrollBy({ left: 356, behavior: 'smooth' }); } } catch (err) {} }
    };
  }
}

<style>

@keyframes c2{0%,100%{background-color:#6CCAD8}16.6%{background-color:#F9DC7A}33.3%{background-color:#7FB4D3}50%{background-color:#9FB0D6}66.6%{background-color:#A9C7A6}83.3%{background-color:#3FA7E0}}

@keyframes c5{0%,100%{background-color:#F4A58A}16.6%{background-color:#F2B8A0}33.3%{background-color:#F2A27A}50%{background-color:#E7A9A0}66.6%{background-color:#F7D9B8}83.3%{background-color:#8FD3F0}}

.board{scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}

.gevlbl{font-family:Italiana,"Schibsted Grotesk",serif;font-size:22px;line-height:1;color:#1C2321;-webkit-text-stroke:0.016em currentColor}
.gevid{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(28,35,33,0.06);overflow-x:auto;scrollbar-width:none;max-width:100%;box-sizing:border-box}

.benefits-in>div{min-width:0}

.skip:focus{top:12px;color:#FFFFFF}
@media (max-width:760px){.gtopics{margin:0 -18px;padding:0 18px 2px}.gcard{flex-basis:280px;height:370px}.gtrack{margin:0 -18px;padding:4px 18px 20px !important;scroll-padding-left:18px !important}.glegend{display:none !important}.garrows{display:none !important}}
@media (max-width:760px){.xl{font-size:56px !important}.board-h{height:844px !important;height:min(100svh,844px) !important}.board-t{padding:40px 28px !important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.flin{transition:none}.orb,.flower,.breathe,.dotrun,.huebase{animation:none !important}.petal{animation:none !important;opacity:1;transform:translate(var(--dx),var(--dy))}}
@media (max-width:760px){.h1{font-size:50px !important}.h2{font-size:40px !important}.pad{padding-left:18px !important;padding-right:18px !important}.sec{padding-top:88px !important;padding-bottom:88px !important}.navd{display:none !important}.burger{display:inline-flex !important}.hdr{grid-template-columns:1fr auto !important}.wm{justify-self:start !important;font-size:22px !important}[style*="grid-template-columns: repeat(auto-fit"]{grid-template-columns:1fr !important}.herotop{padding:72px 20px 40px !important}.benefits-in{padding:72px 22px !important}.phonewrap{aspect-ratio:auto !important;padding:56px 0}}
</style>
</head>

<main>

<section id="join" class="pad" style="padding: 8px 24px 0">
<div class="huebase" style="position: relative; max-width: 1392px; margin: 0 auto; border-radius: 36px; overflow: hidden; background: #E6ECE8">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
<div class="orb" style="left: -8%; top: -14%; width: 46%; background: #8FD8B4; opacity: 0.9; animation: drift 24s ease-in-out infinite alternate, c1 90s ease-in-out infinite"></div>
<div class="orb" style="right: -10%; top: 22%; width: 42%; background: #6CCAD8; opacity: 0.75; animation: drift 30s ease-in-out -8s infinite alternate-reverse, c2 90s ease-in-out infinite"></div>
<div class="orb" style="left: 4%; bottom: -24%; width: 40%; background: #3FAF78; opacity: 0.5; animation: drift 34s ease-in-out -4s infinite alternate, c3 90s ease-in-out infinite"></div>
<div class="orb" style="right: 12%; top: -18%; width: 30%; background: #E4E87A; animation: drift 26s ease-in-out -12s infinite alternate, glow 20s ease-in-out infinite, c4 90s ease-in-out infinite"></div>
<div class="orb" style="left: 38%; top: 40%; width: 30%; background: #F4A58A; animation: drift 28s ease-in-out -6s infinite alternate-reverse, glow 16s ease-in-out -8s infinite, c5 90s ease-in-out infinite"></div>
</div>
<svg aria-hidden="true" viewBox="0 0 1000 1000" style="position: absolute; left: 50%; top: -60px; width: 1000px; height: 1000px; margin-left: -500px; overflow: visible; -webkit-mask-image: radial-gradient(42% 30% at 50% 44%, transparent 0%, transparent 72%, #000 100%); mask-image: radial-gradient(42% 30% at 50% 44%, transparent 0%, transparent 72%, #000 100%)">
<defs>

<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"></feGaussianBlur><feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b2"></feGaussianBlur><feMerge><feMergeNode in="b1"></feMergeNode><feMergeNode in="b2"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
<g class="flower"><g class="breathe" fill="none" stroke-width="1.4" filter="url(#glow)">
<g class="petal" style="--dx: 0px; --dy: 0px; animation-delay: 0s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle></g>
<g class="petal" style="--dx: 190px; --dy: 0px; animation-delay: 0.15s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle>
<g class="dotrun"><circle cx="800" cy="500" r="14" fill="#FFFFFF" stroke="none" opacity="0.6" filter="url(#soft)"></circle><circle cx="800" cy="500" r="6" fill="#FFFFFF" stroke="none"></circle></g></g>
<g class="petal" style="--dx: 95px; --dy: 164.5px; animation-delay: 0.3s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle></g>
<g class="petal" style="--dx: -95px; --dy: 164.5px; animation-delay: 0.45s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle>
<g class="dotrun" style="animation-duration: 58s; animation-direction: reverse"><circle cx="200" cy="500" r="14" fill="#FFFFFF" stroke="none" opacity="0.6" filter="url(#soft)"></circle><circle cx="200" cy="500" r="6" fill="#FFFFFF" stroke="none"></circle></g></g>
<g class="petal" style="--dx: -190px; --dy: 0px; animation-delay: 0.6s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle></g>
<g class="petal" style="--dx: -95px; --dy: -164.5px; animation-delay: 0.75s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle></g>
<g class="petal" style="--dx: 95px; --dy: -164.5px; animation-delay: 0.9s"><circle cx="500" cy="500" r="300" stroke="#FFFFFF" opacity="0.95"></circle>
<g class="dotrun" style="animation-duration: 52s"><circle cx="500" cy="200" r="14" fill="#FFFFFF" stroke="none" opacity="0.6" filter="url(#soft)"></circle><circle cx="500" cy="200" r="6" fill="#FFFFFF" stroke="none"></circle></g></g>
</g></g>
</svg>
<div class="herotop" style="position: relative; padding: 120px 32px 56px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px">

<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #1C2321; max-width: 48ch">One membership across longevity products and services. <br>Get the member price on your first three visits to each place. Every visit earns points to spend across the network.</p>

<sc-if value="{{stepForm}}">
<form onSubmit="{{submitJoin}}" aria-label="Join NIA CLUB" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; max-width: 640px">
<label style="flex: 1 1 170px; text-align: left"><span class="sr">First name</span><input type="text" name="first_name" autocomplete="given-name" placeholder="First name" required=""></label>
<label style="flex: 2 1 240px; text-align: left"><span class="sr">Email</span><input type="email" name="email" autocomplete="email" placeholder="Email" required=""></label>

</form>
<p style="margin: -14px 0 0; font-size: 18px; color: #1C2321">No card, no commitment. Leave any time.</p>
<sc-if value="{{hasFormError}}"><p role="alert" style="margin: -6px 0 0; font-size: 15px; color: #A3321A; font-weight: 500">{{formError}}</p></sc-if>

<script type="text/x-dc" id="dc-logic" data-props='{"signups":{"default":0}}'>

  constructor(props) {

  }
  initBoard() {
    var self = this;
    var el = document.getElementById('nia-board');
    if (!el) { self._boardEl = null; return; }
    self._boardEl = el;
    var TW = 1800, TH = 1200;
    el.scrollLeft = TW * 1.5 - el.clientWidth / 2;
    el.scrollTop = TH * 1.5 - el.clientHeight / 2;
    el.addEventListener('scroll', function () {
      var dx = 0, dy = 0;
      if (el.scrollLeft < TW / 2) { dx = TW; } else if (el.scrollLeft > TW * 1.5) { dx = -TW; }
      if (el.scrollTop < TH / 2) { dy = TH; } else if (el.scrollTop > TH * 1.5) { dy = -TH; }
      if (dx) { el.scrollLeft += dx; if (self._drag) { self._drag.l += dx; } }
      if (dy) { el.scrollTop += dy; if (self._drag) { self._drag.t += dy; } }
    }, { passive: true });
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) { return; }

      self._moved = false;
    });

      var d = self._drag;
      if (!d) { return; }

      if (!self._moved && Math.abs(mx) + Math.abs(my) > 6) { self._moved = true; el.style.cursor = 'grabbing'; }
      if (self._moved) { el.scrollLeft = d.l - mx; el.scrollTop = d.t - my; }
    });
    window.addEventListener('pointerup', function () { if (self._drag) { self._drag = null; el.style.cursor = ''; } });
  }
  renderVals() {

    var gradeLabels = { strong: 'Strong', moderate: 'Moderate', early: 'Early', weak: 'Weak', concept: 'Concept' };

    var glossCats = [['basics', 'Ageing basics'], ['tests', 'Tests'], ['therapies', 'Heat, cold and recovery'], ['movement', 'Movement, food and sleep'], ['supps', 'Supplements'], ['skin', 'Skin']];
    var glossData = {
      basics: [
        ['Healthspan', 'concept', 'The years you live in good health, free of serious illness. Lifespan is simply how long you live.', 'Most longevity research now aims at healthspan. Be wary of anyone promising to add years to your life.'],
